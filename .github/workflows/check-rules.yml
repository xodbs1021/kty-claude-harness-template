# 하네스 게이트·검사기의 회귀 테스트 모음 — 게이트 위음성(조용한 실패)을 머지 전에 잡는다.
# (사본 대조 검사는 2026-08-17 단일 정본화로 폐지 — 판정 기준은 principles.md 한 곳뿐이고
#  dispatch 주입으로 전달된다. ADR-0021 실험 종결 판정.)
name: check-rules

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-regressions:
    # 게이트·검사기의 회귀 테스트 묶음 — 게이트가 조용히 무력화되는 회귀를 머지 전에 잡는다.
    # (대부분의 게이트는 위음성이 치명이고, 결정 게이트는 위양성도 치명 — 각 스텝 주석 참조.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 이 워크스페이스에서 PR 이 작성한 셸 스크립트를 실행한다 —
          # .git/config 에 토큰을 남기지 않는다.
          persist-credentials: false
      - name: 완료 게이트 검사 범위 회귀 테스트
        run: ./tests/mark-needs-audit.test.sh
      # harness.env 를 실행하지 않고 원문으로 읽는 파서의 회귀 방어.
      # 여기가 조용히 틀리면 값에 쓰레기가 섞여 rc=127 이 되고 타입체크 게이트가 사라진다.
      - name: harness.env 원문 판독 회귀 테스트
        run: ./tests/harness-env-read.test.sh
      # harness.env 편집 검증 훅(ADR-0016). 문법 실수의 조용한 검사 생략을 편집 즉시
      # 알리는 훅 — 부재(rc=3)/못 믿음(rc=1) 구분이 위양성 방어의 절반이다.
      - name: harness.env 편집 검증 훅 회귀 테스트
        run: ./tests/check-harness-env.test.sh
      - name: 층 경계 검사기 회귀 테스트
        run: ./tests/check-layer-boundary.test.sh
      # 설계 경로 강제 훅. 여기가 조용히 무력화되면 설계 산출물이 회수 규약 없이 나간다
      # (2026-08-31 실사고의 재발 방지 게이트 — [cx r7 M-3]: CI 미등록이라 깨져도 녹색이었다).
      - name: 설계 경로 강제 훅 회귀 테스트
        run: ./tests/guard-design-path.test.sh
      # 훅 교체 도중 중단되면 구판으로 되돌아가는가. 이 축의 실패는 "설치 성공"이라는
      # 거짓 보고로 나오므로 rc 만이 아니라 파일 상태·잔류물·문구까지 잰다.
      - name: 훅 교체 원자성 회귀 테스트
        run: ./tests/install-hook-swap.test.sh
      # 에이전트가 자기 규율을 우회하는 것을 막는 게이트들. 위음성이 유일한 치명 결함이다.
      - name: 자기 규율 게이트 회귀 테스트
        run: ./tests/self-discipline-gates.test.sh
      # 결정 게이트. 여기서는 **위양성도 치명적**이다 — 질문이 소음이 되면 진짜 질문도
      # 무시되고, 그러면 사람이 게이트를 끈다. 그래서 케이스 절반이 위양성 방어다.
      - name: 결정 게이트 회귀 테스트
        run: ./tests/decision-gate.test.sh
      # 머리 표명 게이트(ADR-0013 회수 1줄 + ADR-0015 레퍼런스 조사 2줄).
      # 새 상태 전이(자동 해제·재평가·게이트별 예산 키)가
      # 기존 게이트 기계를 깨지 않는지가 케이스의 절반이다.
      - name: 머리 표명 게이트 회귀 테스트
        run: ./tests/retrieval-attestation.test.sh
      # 발행 전 리뷰 게이트(ADR-0022 — 영수증 게이트의 축소판). 위음성(리뷰 없는 발행
      # 통과)이 유일한 치명 결함이라, 케이스가 rc 와 차단 사유 문구를 함께 잰다.
      - name: 발행 전 리뷰 게이트 회귀 테스트
        run: ./tests/guard-publish-review.test.sh
      # 스타일 게이트(ADR-0023). 위음성 축이 둘이다 — 타입체크 슬롯을 덮어써서 사라지는
      # 것과, 키를 모르는 기존 설치본에서 조용히 꺼지는 것. 케이스가 둘 다 잰다.
      - name: 스타일 검사 게이트 회귀 테스트
        run: ./tests/stylecheck-gate.test.sh
      # Bash 로 쓴 파일의 완료 게이트(ADR-0024). 이 게이트가 없던 동안 하네스 정본을
      # Bash 로 고친 세션이 통째로 무게이트로 끝났다 — 그 재발을 막는다.
      - name: Bash 쓰기 스윕 회귀 테스트
        run: ./tests/bash-write-sweep.test.sh
      # 게이트 상태의 세션 격리(2026-10-01). 워크트리 세션들이 메인 체크아웃의 플래그 하나를
      # 같이 써서 서로의 종료를 막은 실사고의 재발 방지 — 변이 6개가 이 시험에서 적색이다.
      - name: 게이트 상태 세션 격리 회귀 테스트
        run: ./tests/session-state-isolation.test.sh
      # 워크트리 세션의 프로젝트 루트(2026-10-01). 메인 체크아웃을 루트로 넘겨받아 워크트리
      # 편집이 `.claude/*` 로 분류돼 게이트가 하나도 서지 않던 결함의 재발 방지.
      - name: 워크트리 프로젝트 루트 회귀 테스트
        run: ./tests/worktree-project-dir.test.sh
      - name: 층 경계 검사 (글루에 상위 층 구현이 샜나)
        run: ./scripts/check-layer-boundary.sh
